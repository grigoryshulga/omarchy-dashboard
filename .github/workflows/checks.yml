name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: QML and Python
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git python qt6-declarative qt6-tools ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: QML behavior
        run: bash tests/qml-model.sh
      - name: Python helpers, CLI and adapters
        run: python3 -m unittest discover -s tests -p 'test_*.py'
